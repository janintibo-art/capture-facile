name: Construire EXE Windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        run: python -m pip install -r requirements.txt
      - name: Compiler le moteur natif C++ (x64)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Compilateur Visual C++ absent" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" && cl /nologo /O2 /LD /EHsc /Fe:capture_native.dll native\capture_native.cpp gdi32.lib user32.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path capture_native.dll)) { throw "DLL native absente" }
          cmd /c "`"$vcvars`" && cl /nologo /O2 /LD /EHsc /std:c++17 /Fe:capture_dxgi.dll native\capture_dxgi.cpp d3d11.lib dxgi.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path capture_dxgi.dll)) { throw "DLL DirectX absente" }
      - name: Creer CaptureFacile.exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name CaptureFacile --collect-data customtkinter --collect-all imageio_ffmpeg --collect-all dxcam --collect-all mss --add-binary "capture_native.dll;." --add-binary "capture_dxgi.dll;." main.py
      - name: Publier artefact EXE
        uses: actions/upload-artifact@v4
        with:
          name: CaptureFacile-Windows
          path: dist/CaptureFacile.exe
      - name: Publication GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" dist/CaptureFacile.exe --title "Capture Facile ${{ github.ref_name }}" --notes "EXE Windows autonome : aucune installation Python requise." --verify-tag
